workflows:
  ios-workflow:
    name: iOS Build
    instance_type: mac_mini_m1
    environment:
      xcode: latest
    scripts:
      - name: Install XcodeGen
        script: brew install xcodegen
      - name: Generate Project
        script: xcodegen generate
      - name: Build App
        script: xcodebuild clean build -project AntiTheftTracker.xcodeproj -scheme AntiTheftTracker -configuration Release -sdk iphoneos CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO CODE_SIGNING_ALLOWED=NO
      - name: Create IPA
        script: |
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphoneos/AntiTheftTracker.app Payload/
          zip -r AntiTheftTracker.ipa Payload
    artifacts:
      - AntiTheftTracker.ipa
