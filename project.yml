name: AntiTheftTracker
options:
  bundleIdPrefix: com.antitheft
  deploymentTarget:
    iOS: "16.0"
targets:
  AntiTheftTracker:
    type: application
    platform: iOS
    sources:
      - path: .
        excludes:
          - "project.yml"
          - "codemagic.yaml"
    info:
      path: Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.antitheft.trackerapp
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGNING_ALLOWED: NO
        CODE_SIGNING_REQUIRED: NO
        CODE_SIGN_IDENTITY: ""
